name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, "feature/**", "devops/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend and PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securebyte_test
          POSTGRES_USER: securebyte_ci
          # Public, disposable CI credential. Never use this for a deployed database.
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securebyte_ci -d securebyte_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_NAME: securebyte_test
      DATABASE_USER: securebyte_ci
      DATABASE_PASSWORD: ci_only_password
      COOKIE_SECURE: "true"
      AUTH_SOURCE_LIMIT: "20"
      AUTH_SOURCE_WINDOW_SECONDS: "60"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate backend syntax and imports
        run: npm run check
      - name: Generate disposable CI encryption key
        run: printf 'TOTP_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Apply the real database schema
        run: npm run db:test:prepare
      - name: Run real HTTP authentication integration tests
        run: npm test

  docker:
    name: Docker builds and Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKEND_IMAGE: securebyte-backend:ci
      FRONTEND_IMAGE: securebyte-frontend:ci
      DATABASE_NAME: securebyte_compose_test
      DATABASE_USER: securebyte_ci
      COOKIE_SECURE: "false"
      FRONTEND_PORT: "8080"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Generate disposable Compose credentials
        run: |
          printf 'DATABASE_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'TOTP_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build backend image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          load: true
          push: false
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,scope=ci-backend,mode=max
      - name: Build frontend image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          load: true
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,scope=ci-frontend,mode=max
      - name: Validate Compose and start the built images
        run: |
          docker compose config --quiet
          docker compose up --no-build --wait --wait-timeout 120
      - name: Verify frontend and proxied backend readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /tmp/frontend.html
          test -s /tmp/frontend.html
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health/db
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100
      - name: Remove disposable containers and test data
        if: always()
        run: docker compose down --volumes --remove-orphans

  required:
    name: CI required checks
    if: always()
    needs: [frontend, backend, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$DOCKER_RESULT" = success
