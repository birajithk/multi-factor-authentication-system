name: securebyte

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-securebyte}
      POSTGRES_USER: ${DATABASE_USER:-securebyte_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-securebyte-backend:local}
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-securebyte}
      DATABASE_USER: ${DATABASE_USER:-securebyte_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the root .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set a 64-hex-character TOTP_ENCRYPTION_KEY in the root .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUTH_SOURCE_LIMIT: ${AUTH_SOURCE_LIMIT:-20}
      AUTH_SOURCE_WINDOW_SECONDS: ${AUTH_SOURCE_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-securebyte-frontend:local}
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  postgres_data:
